<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canvas</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { width: 100%; height: 100%; }

    body { min-height: 100vh; background-color: #000; }

    #bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .canvas {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
    }

    #nav-home {
      position: fixed;
      top: 0; left: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 10px 16px;
      background: #000;
      font-family: 'Inter', sans-serif;
      font-size: clamp(14px, 1.8vw, 22px);
      font-weight: 600;
      letter-spacing: -0.06em;
      color: #fff;
      text-decoration: none;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: background 0.2s;
    }
    #nav-home:hover { background: #222; }

    #intro-overlay {
      position: fixed;
      inset: 0;
      background: transparent;
      z-index: 9000;
      pointer-events: none;
    }

    #intro-rect {
      position: absolute;
      background: #000;
      overflow: hidden;
    }

    #intro-ux,
    #intro-impulse,
    #intro-combined {
      position: absolute;
      font-family: 'Inter', sans-serif;
      font-weight: 600;
      letter-spacing: -0.06em;
      color: #fff;
      white-space: nowrap;
      line-height: 1;
      opacity: 0;
    }
  </style>
</head>
<body>
  <video id="bg" src="https://pub-635e146039e948ffb5c383d517d11306.r2.dev/chosen-2.mp4" autoplay muted playsinline></video>
  <script>
    document.getElementById('bg').addEventListener('ended', function() {
      this.pause();
    });
  </script>
  <div class="canvas">
    <!-- place your designs here -->
  </div>

  <a href="#" id="nav-home" onclick="window.scrollTo({top:0,behavior:'smooth'});return false;">UX IMPULSE</a>

  <div id="intro-overlay">
    <div id="intro-rect">
      <div id="intro-ux">UX</div>
      <div id="intro-impulse">IMPULSE</div>
      <div id="intro-combined">UX IMPULSE</div>
    </div>
  </div>

  <script>history.scrollRestoration = 'manual'; window.scrollTo(0, 0);</script>

  <script>
(function () {
  const overlay = document.getElementById('intro-overlay');
  const rectEl  = document.getElementById('intro-rect');
  const uxEl    = document.getElementById('intro-ux');
  const impEl   = document.getElementById('intro-impulse');
  const combEl  = document.getElementById('intro-combined');
  if (!overlay) return;

  function easeInCubic(t)    { return t * t * t; }
  function easeInOutCubic(t) { return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2; }
  function lerp(a, b, t)     { return a + (b - a) * t; }

  const RW = 1728, RH = 1117;
  function fx(v) { return v / RW * window.innerWidth; }
  function fy(v) { return v / RH * window.innerHeight; }

  const S1 = { rx:654, ry:551, rw:420, rh:15 };
  const S2 = { rx:654, ry:349, rw:420, rh:420, fs:75 };
  const S4 = { rw:264, rh:63 };

  const _fs = fx(S2.fs);

  /* Pre-measure off-screen */
  [uxEl, impEl, combEl].forEach(el => {
    el.style.cssText = `position:fixed;left:-9999px;top:-9999px;opacity:0;`
      + `font-size:${_fs}px;font-weight:600;letter-spacing:-0.06em;`
      + `line-height:1;white-space:nowrap;font-family:'Inter',sans-serif;`;
  });
  const spaceEl = document.createElement('span');
  spaceEl.style.cssText = `position:fixed;left:-9999px;top:-9999px;opacity:0;`
    + `font-size:${_fs}px;font-weight:600;letter-spacing:-0.06em;`
    + `line-height:1;white-space:pre;font-family:'Inter',sans-serif;`;
  spaceEl.textContent = ' ';
  document.body.appendChild(spaceEl);

  document.fonts.ready.then(() => {
    const UXW    = uxEl.offsetWidth;
    const IW     = impEl.offsetWidth;
    const IH     = impEl.offsetHeight;
    const COMBW  = combEl.offsetWidth;
    const SPACEW = spaceEl.offsetWidth;
    document.body.removeChild(spaceEl);

    const PAD  = fy(7);

    /* Dynamic rect width — ensures UX always fits */
    const S2rw = Math.max(fx(S2.rw), UXW + PAD * 2);

    /* Move text elements inside rectEl so overflow:hidden clips them */
    rectEl.appendChild(uxEl);
    rectEl.appendChild(impEl);
    rectEl.appendChild(combEl);

    /* Reset styles for inside-rect positioning */
    [uxEl, impEl, combEl].forEach(el => {
      el.style.cssText = `position:absolute;font-size:${_fs}px;font-weight:600;`
        + `letter-spacing:-0.06em;line-height:1;white-space:nowrap;`
        + `font-family:'Inter',sans-serif;color:#fff;opacity:0;`;
    });

    const T = { expandEnd:1500, holdEnd:2500, inlineEnd:3200, navEnd:3900 };
    const START = performance.now();

    function setRect(left, top, width, height) {
      rectEl.style.cssText = `position:absolute;background:#000;overflow:hidden;`
        + `left:${left}px;top:${top}px;width:${width}px;height:${height}px;`;
    }

    function tick(now) {
      const e = now - START;

      if (e < T.expandEnd) {
        /* ── S1 → S2: thin line expands to square ── */
        const t   = easeInOutCubic(e / T.expandEnd);
        const rh  = lerp(S1.rh, S2.rh, t);
        const ry  = lerp(S1.ry + S1.rh/2, S2.ry + S2.rh/2, t) - rh/2;
        const rLeft = fx(S2.rx);
        const rTop  = fy(ry);
        setRect(rLeft, rTop, S2rw, fy(rh));

        uxEl.style.opacity   = '1';
        impEl.style.opacity  = '1';
        combEl.style.opacity = '0';
        uxEl.style.fontSize  = _fs + 'px';
        impEl.style.fontSize = _fs + 'px';

        /* rect-relative: UX slides in from left, IMPULSE from right */
        uxEl.style.left  = lerp(-UXW, PAD, t) + 'px';
        uxEl.style.top   = (-PAD) + 'px';
        impEl.style.left = lerp(S2rw, S2rw - IW - PAD, t) + 'px';
        impEl.style.top  = (fy(rh) - IH + PAD) + 'px';

      } else if (e < T.holdEnd) {
        /* ── Hold: square fully revealed ── */
        setRect(fx(S2.rx), fy(S2.ry), S2rw, fy(S2.rh));
        uxEl.style.opacity   = '1';
        impEl.style.opacity  = '1';
        combEl.style.opacity = '0';
        uxEl.style.fontSize  = _fs + 'px';
        impEl.style.fontSize = _fs + 'px';
        uxEl.style.left  = PAD + 'px';
        uxEl.style.top   = (-PAD) + 'px';
        impEl.style.left = (S2rw - IW - PAD) + 'px';
        impEl.style.top  = (fy(S2.rh) - IH + PAD) + 'px';

      } else if (e < T.inlineEnd) {
        /* ── S2 → S3: square morphs to centered inline rect ── */
        const t = easeInCubic((e - T.holdEnd) / (T.inlineEnd - T.holdEnd));

        /* S3 target geometry — PAD*4 matches reference */
        const S3rH  = IH + PAD * 4;
        const S3rW  = COMBW + PAD * 4;
        const S3rX  = (window.innerWidth  - S3rW) / 2;
        const S3rY  = (window.innerHeight - S3rH) / 2;

        /* Shared vertical center inside S3 rect */
        const S3cY  = (S3rH - IH) / 2;

        /* Horizontal positions of UX and IMPULSE inside S3 rect */
        const S3textLeft = (S3rW - COMBW) / 2;
        const S3uxX  = S3textLeft;
        const S3impX = S3textLeft + UXW + SPACEW;

        /* Interpolated rect */
        const rX = lerp(fx(S2.rx), S3rX, t);
        const rY = lerp(fy(S2.ry), S3rY, t);
        const rW = lerp(S2rw,      S3rW, t);
        const rH = lerp(fy(S2.rh), S3rH, t);
        setRect(rX, rY, rW, rH);

        uxEl.style.opacity   = '1';
        impEl.style.opacity  = '1';
        combEl.style.opacity = '0';
        uxEl.style.fontSize  = _fs + 'px';
        impEl.style.fontSize = _fs + 'px';

        /* rect-relative positions converging from corners to centre */
        uxEl.style.left  = lerp(PAD,              S3uxX,  t) + 'px';
        uxEl.style.top   = lerp(-PAD,             S3cY,   t) + 'px';
        impEl.style.left = lerp(S2rw - IW - PAD,  S3impX, t) + 'px';
        impEl.style.top  = lerp(fy(S2.rh) - IH + PAD, S3cY, t) + 'px';

        if (t >= 0.98) {
          uxEl.style.opacity   = '0';
          impEl.style.opacity  = '0';
          combEl.style.opacity = '1';
          combEl.style.fontSize = _fs + 'px';
          combEl.style.left = S3textLeft + 'px';
          combEl.style.top  = S3cY + 'px';
        }

      } else if (e < T.navEnd) {
        /* ── S3 → S4: inline rect flies to nav pill ── */
        const t = easeInOutCubic((e - T.inlineEnd) / (T.navEnd - T.inlineEnd));

        const S3rH = IH + PAD * 4;
        const S3rW = COMBW + PAD * 4;
        const S3rX = (window.innerWidth  - S3rW) / 2;
        const S3rY = (window.innerHeight - S3rH) / 2;
        const S3cY = (S3rH - IH) / 2;
        const S3textLeft = (S3rW - COMBW) / 2;

        const navHome = document.getElementById('nav-home');
        const navR  = navHome ? navHome.getBoundingClientRect() : null;
        const navFS = navHome ? parseFloat(getComputedStyle(navHome).fontSize) : 16;
        const S4rX  = navR ? navR.left   : 0;
        const S4rY  = navR ? navR.top    : 0;
        const S4rW  = navR ? navR.width  : fx(S4.rw);
        const S4rH  = navR ? navR.height : fy(S4.rh);

        const rX = lerp(S3rX, S4rX, t);
        const rY = lerp(S3rY, S4rY, t);
        const rW = lerp(S3rW, S4rW, t);
        const rH = lerp(S3rH, S4rH, t);
        setRect(rX, rY, rW, rH);

        uxEl.style.opacity   = '0';
        impEl.style.opacity  = '0';
        combEl.style.opacity = '1';
        combEl.style.color   = '#fff';
        combEl.style.fontSize = lerp(_fs, navFS, t) + 'px';
        /* rect-relative: text tracks from centred to left-padded */
        combEl.style.left = lerp(S3textLeft - (rX - S3rX), 16 - (rX - S4rX), t) + 'px';
        combEl.style.top  = lerp(S3cY,       (S4rH - navFS) / 2, t) + 'px';

      } else {
        overlay.style.display = 'none';
        const navHome = document.getElementById('nav-home');
        if (navHome) {
          navHome.style.opacity = '1';
          navHome.style.pointerEvents = 'auto';
        }
        return;
      }

      requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);
  });
})();
  </script>

</body>
</html>
